    <div class="redirect-card">
        <div class="spinner-container">
            <div class="spinner"></div>
        </div>
        <h1>Heading to Destination</h1>
        <p>Please wait while we redirect you...</p>

    <!-- Load configuration -->
    
    <script src="config.js"></script>
    
    <!-- Redirect logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Parse URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const targetKey = urlParams.get('to');
            
            // Determine final URL based on config
            let finalUrl = redirectConfig.defaultUrl;
            
            if (targetKey && redirectConfig.paths[targetKey]) {
                finalUrl = redirectConfig.paths[targetKey];
            }
            
            // Update UI
            const displayUrlElem = document.getElementById('display-url');
            const manualLinkElem = document.getElementById('manual-link');
            
            displayUrlElem.textContent = finalUrl;
            manualLinkElem.href = finalUrl;
            
            // Perform redirect
            setTimeout(() => {
                window.location.href = finalUrl;
            }, redirectConfig.delayMs);
        });
    </script>
